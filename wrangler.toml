name = "ead"
main = "cloudflare/worker.js"
compatibility_date = "2025-03-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "UNANSWERED_KV"
id = "afbecddb46bd4c7f935e45fb87b1dd91"

# Secondary Cloudflare Worker environment ("dawahx-assistant")
# Deploy command in Cloudflare Dashboard: npx wrangler deploy --name dawahx-assistant
[env.assistant]
name = "dawahx-assistant"
workers_dev = true

[env.assistant.assets]
directory = "."
binding = "ASSETS"

[env.assistant.ai]
binding = "AI"

[env.assistant.kv_namespaces]
binding = "UNANSWERED_KV"
id = "afbecddb46bd4c7f935e45fb87b1dd91"
